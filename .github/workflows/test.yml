name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run managed unit tests
        run: dotnet test .\PhotoManager.slnx -c Release --filter "Category!=UI" --collect:"XPlat Code Coverage"

      - name: Run PowerShell workflow tests
        shell: pwsh
        run: .\tools\czkawka\tests\run-all-tests.ps1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
